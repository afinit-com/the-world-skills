<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하네스 · 캐릭터 관계도</title>
<style>
:root{color-scheme:light;--ink:#253b35;--muted:#63716a;--paper:#f4f0e7;--line:#dadbd0;--accent:#b76136}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}
button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #c7803d;outline-offset:4px}
header{padding:36px 42px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:24px;align-items:end}
.eyebrow{font-size:11px;letter-spacing:3px;font-weight:800;color:var(--accent)}h1{font-family:Georgia,serif;font-size:38px;letter-spacing:-1.5px;margin:9px 0}p{line-height:1.7}header p{margin:0;color:var(--muted);font-size:14px}.stamp{text-align:right;font-size:12px;line-height:1.8;color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;max-width:1800px;margin:auto}.workspace{padding:22px;min-width:0}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.toolbar input{border:1px solid var(--line);background:#fff9;padding:10px 14px;border-radius:9px;width:240px}.controls{display:flex;gap:8px}.controls button{border:1px solid var(--line);background:#fff9;border-radius:8px;padding:10px 13px;color:var(--ink)}.controls button[aria-pressed=true]{background:var(--ink);color:white}
.map-scroll{overflow:auto;border:1px solid var(--line);border-radius:16px;background:radial-gradient(ellipse at center,#fdfbf6 0%,#ebe9df 100%)}.map-frame{margin:auto}.map{position:relative;transform-origin:top left;min-width:960px;height:780px;background-image:radial-gradient(#77827726 .8px,transparent .8px);background-size:18px 18px}svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.ring{fill:none;stroke:#c5cec1;stroke-dasharray:4 8;opacity:.6}.edge{fill:none;stroke:#99aaa0;stroke-width:1.7;transition:opacity .2s}.edge.active{stroke:var(--accent);stroke-width:3;stroke-dasharray:8 5;animation:flow 1.1s linear infinite}.edge.faded{opacity:.22}.edge-label{font-size:12px;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:7px;stroke-linejoin:round}.edge-label.faded{opacity:.35}
@keyframes flow{to{stroke-dashoffset:-26}}.character{position:absolute;transform:translate(-50%,-50%);width:154px;padding:0;border:0;background:transparent;color:var(--ink);text-align:center;transition:opacity .2s}.character.faded{opacity:.25}.portrait{height:132px;width:118px;margin:auto auto 10px;border:5px solid #fcfaf4;border-radius:55px 55px 20px 20px;box-shadow:0 7px 22px #263b351c;background:linear-gradient(145deg,#809c90,#2d5047);display:grid;place-items:center;position:relative;overflow:hidden}.portrait::after{content:"";position:absolute;inset:9px;border:1px solid #ffffff40;border-radius:45px 45px 12px 12px;pointer-events:none}.portrait img{width:100%;height:100%;object-fit:cover}.monogram{font-family:Georgia,serif;font-size:44px;color:#f9efda}.character.main .portrait{height:160px;width:142px;background:linear-gradient(145deg,#cfa66e,#765332)}.character.selected .portrait{outline:3px solid var(--accent);outline-offset:4px}.name{display:block;font-size:18px;font-weight:800}.role{display:block;font-size:11px;color:var(--muted);margin:5px 0}.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:3px}.chip{font-size:10px;background:#fff9;border:1px solid #d8ddd3;padding:3px 6px;border-radius:5px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.map-caption{padding:13px 17px;background:#fff6;border-top:1px solid var(--line);font-size:12px;color:var(--muted);margin:0}
.story{margin-top:16px;padding:20px 22px;background:#253b35;color:#eef1e9;border-radius:12px;min-height:112px}.story small{color:#c9bc95;font-size:11px;letter-spacing:1px}.story h2{font-size:18px;margin:8px 0}.story p{font-size:13px;margin:0;color:#cbd6cc}.relations{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.relations button{background:#fff8;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink)}.relations button[aria-pressed=true]{background:var(--ink);color:white}.empty{font-size:13px;color:var(--muted)}
aside{padding:28px 24px;border-left:1px solid var(--line);background:#fbf9f2}.panel-tag{font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:800}aside h2{font-size:27px;margin:12px 0 7px}aside h3{font-size:13px;margin:25px 0 10px}aside p{font-size:13px;color:var(--muted)}.lesson{background:#e9eee5;border-left:3px solid #69846c;border-radius:0 7px 7px 0;padding:12px 14px;margin:18px 0;font-size:12px;line-height:1.8}.tool{border-top:1px solid var(--line);padding:12px 0}.tool strong{font-size:12px;overflow-wrap:anywhere}.tool p{font-size:12px;margin:5px 0;white-space:pre-wrap}.scope{font-family:ui-monospace,monospace;font-size:11px;overflow-wrap:anywhere;color:#8a573a}.job{font-size:12px;border:1px solid var(--line);padding:12px;border-radius:8px;margin:8px 0}.job b{display:block;margin-bottom:6px}.note{font-size:11px!important;color:var(--muted)}footer{padding:18px 42px;font-size:11px;border-top:1px solid var(--line);color:var(--muted)}
@media(max-width:1050px){.layout{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid var(--line)}header{padding:24px;align-items:start}.stamp{display:none}.workspace{padding:14px}h1{font-size:30px}}@media(prefers-reduced-motion:reduce){.edge.active{animation:none}*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div><div class="eyebrow">THE WORLD / CHARACTER ATLAS</div><h1 id="title"></h1><p>누가 누구와 협력할까? 캐릭터를 눌러 각자의 tool을 살펴보세요.</p></div><div class="stamp">하나의 세계, 서로 다른 재능<br><span id="counts"></span></div></header>
<div class="layout"><main class="workspace">
<div class="toolbar"><input id="search" type="search" placeholder="캐릭터 또는 tool 찾기" aria-label="캐릭터 또는 tool 찾기"><div class="controls"><button id="zoom" aria-pressed="false">확대 보기</button><button id="reset">전체 관계</button><button id="play" aria-pressed="false">▷ 관계 둘러보기</button></div></div>
<div class="map-scroll"><div class="map-frame" id="map-frame"><div class="map" id="map"><svg id="edges" aria-hidden="true"></svg></div></div><p class="map-caption">화살표는 설정한 관계의 방향입니다. 실제 대화 기록이나 실행 중인 작업을 나타내지 않습니다.</p></div>
<section class="story" aria-live="polite"><small>RELATIONSHIP / 함께 일하는 방식</small><h2 id="story-title">캐릭터들이 연결되면 이야기가 시작됩니다.</h2><p id="story-text">아래 관계를 선택하거나 ‘관계 둘러보기’를 눌러보세요. 봇이나 tool을 실행하지 않습니다.</p></section>
<nav class="relations" id="relations" aria-label="캐릭터 관계"></nav>
</main><aside id="details" aria-label="캐릭터와 도구 상세"></aside></div>
<footer id="footer"></footer>
<script type="application/json" id="world-data">__WORLD_DATA__</script>
<script>
"use strict";
const world = JSON.parse(document.getElementById("world-data").textContent);
const byKey = new Map(world.characters.map(character => [character.key, character]));
const positions = new Map();
const cards = new Map();
const edgeElements = [];
const relationButtons = [];
const map = document.getElementById("map");
const svg = document.getElementById("edges");
const details = document.getElementById("details");
let selectedKey = null;
let selectedRelation = -1;
let timer = null;
let expanded = false;
const others = world.characters.filter(character => !character.main);
const rings = Math.max(1, Math.ceil(others.length / 8));
const size = Math.max(960, 220 + rings * 610);
const height = Math.max(780, 200 + rings * 610);
map.style.width = size + "px";
map.style.height = height + "px";
svg.setAttribute("viewBox", `0 0 ${size} ${height}`);
function fitMap() {
  const available = document.querySelector(".map-scroll").clientWidth;
  const scale = expanded ? 1 : Math.min(1, available/size);
  map.style.transform = `scale(${scale})`;
  document.getElementById("map-frame").style.width = size*scale + "px";
  document.getElementById("map-frame").style.height = height*scale + "px";
}
new ResizeObserver(fitMap).observe(document.querySelector(".map-scroll"));
document.getElementById("zoom").addEventListener("click",()=>{
  expanded=!expanded;
  document.getElementById("zoom").textContent=expanded ? "한눈에 보기" : "확대 보기";
  document.getElementById("zoom").setAttribute("aria-pressed",String(expanded));
  fitMap();
});
document.getElementById("title").textContent = world.name + " · 인물관계도";
document.title = world.name + " · 캐릭터 관계도";
document.getElementById("counts").textContent = `${world.characters.length}명의 캐릭터 · ${world.relationships.length}개의 관계`;
document.getElementById("footer").textContent = `설정 스냅샷 · ${new Date(world.generated_at).toLocaleString("ko-KR")} · 변경 후 harness.py --world-map으로 다시 생성하세요. 외부 서버 연결 없이 열립니다.`;
function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}
function vector(tag, attributes) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, value);
  return node;
}
const defs = vector("defs", {});
const marker = vector("marker", {id:"arrow", viewBox:"0 0 10 10", refX:9, refY:5, markerWidth:6, markerHeight:6, orient:"auto-start-reverse"});
marker.append(vector("path", {d:"M 0 0 L 10 5 L 0 10 z", fill:"#a8865d"}));
defs.append(marker); svg.append(defs);
for (let ring = 1; ring <= rings; ring++) svg.append(vector("ellipse", {cx:size/2,cy:height/2,rx:ring*305,ry:ring*290,class:"ring"}));
world.characters.filter(character => character.main).forEach(character => positions.set(character.key, [size/2, height/2]));
others.forEach((character, index) => {
  const ring = Math.floor(index / 8) + 1;
  const count = Math.min(8, others.length - (ring - 1) * 8);
  const angle = (index % 8) * 2 * Math.PI / count - Math.PI / 2;
  positions.set(character.key, [size/2 + Math.cos(angle)*ring*305, height/2 + Math.sin(angle)*ring*290]);
});
world.relationships.forEach((relation, index) => {
  const [sourceX, sourceY] = positions.get(relation.source);
  const [targetX, targetY] = positions.get(relation.target);
  const distance = Math.hypot(targetX-sourceX, targetY-sourceY);
  const unitX = (targetX-sourceX)/distance, unitY = (targetY-sourceY)/distance;
  const bend = 36;
  const middleX = (sourceX+targetX)/2 - unitY*bend;
  const middleY = (sourceY+targetY)/2 + unitX*bend;
  const path = vector("path", {d:`M ${sourceX+unitX*92} ${sourceY+unitY*92} Q ${middleX} ${middleY} ${targetX-unitX*100} ${targetY-unitY*100}`,class:"edge","marker-end":"url(#arrow)"});
  const label = vector("text", {x:middleX,y:middleY-7,"text-anchor":"middle",class:"edge-label"});
  label.textContent = relation.label;
  svg.append(path, label);
  edgeElements.push({path,label,relation});
  const button = element("button", `${byKey.get(relation.source).name} → ${byKey.get(relation.target).name} · ${relation.label}`);
  button.setAttribute("aria-pressed", "false");
  button.addEventListener("click", () => { stopTour(); showRelation(index); });
  document.getElementById("relations").append(button);
  relationButtons.push(button);
});
if (!world.relationships.length) document.getElementById("relations").append(element("p", "아직 연결된 관계가 없습니다. 캐릭터들의 협력 관계를 정해보세요.", "empty"));
function allTools(character) {
  return [...character.tool_groups, ...character.jobs.map(job => job.tools)].flatMap(group => group.tools);
}
world.characters.forEach((character, index) => {
  const button = element("button", undefined, "character" + (character.main ? " main" : ""));
  button.style.left = positions.get(character.key)[0] + "px";
  button.style.top = positions.get(character.key)[1] + "px";
  button.setAttribute("aria-label", character.name + "의 역할과 tool 보기");
  button.setAttribute("aria-pressed", "false");
  const portrait = element("span", undefined, "portrait");
  if (character.portrait) {
    const picture = element("img"); picture.src = character.portrait; picture.alt = ""; portrait.append(picture);
  } else {
    const colors = ["#809c90,#2d5047", "#bca987,#756140", "#9ba8b8,#4a5c73", "#b49793,#785657", "#abae83,#5b6842"];
    if (!character.main) portrait.style.background = `linear-gradient(145deg,${colors[index%colors.length]})`;
    portrait.append(element("span", [...character.name].slice(0,2).join(""), "monogram"));
  }
  const role = character.main ? "우리 세계의 중심" : character.jobs.length ? `${character.jobs.length}개 업무 · 캐릭터` : "대화로 함께하는 동료";
  button.append(portrait, element("span", character.name, "name"), element("span", role, "role"));
  const chips = element("span", undefined, "chips");
  const names = [...new Set(allTools(character).map(tool => tool.name))];
  names.slice(0,2).forEach(name => chips.append(element("span", name, "chip")));
  if (names.length>2) chips.append(element("span", `+${names.length-2} tools`, "chip"));
  if (!names.length) chips.append(element("span", "대화 / 상세 보기", "chip"));
  button.append(chips);
  button.addEventListener("click", () => {
    stopTour(); selectedRelation=-1; selectCharacter(character.key);
    document.getElementById("story-title").textContent=character.name + "의 동료들";
    document.getElementById("story-text").textContent="연결된 화살표를 따라 이 캐릭터가 누구와 협력하는지 살펴보세요. 아래에서 관계를 선택하면 자세한 설명이 나옵니다.";
  });
  map.append(button); cards.set(character.key, button);
});
function renderTools(group) {
  details.append(element("h3", group.label));
  if (group.dynamic) {
    details.append(element("p", "대화가 시작될 때 만들어지는 tool입니다. 관계도를 만들면서 실행하지 않으므로 목록과 범위는 아직 알 수 없습니다.", "note")); return;
  }
  if (!group.tools.length) { details.append(element("p", "등록된 tool 없음", "note")); return; }
  group.tools.forEach(tool => {
    const block = element("div", undefined, "tool");
    block.append(element("strong", tool.name), element("p", tool.description || "설명이 아직 없습니다."));
    if (tool.write_roots.length) block.append(element("div", "선언된 쓰기 경로: " + tool.write_roots.join(", "), "scope"));
    details.append(block);
  });
}
function selectCharacter(key) {
  selectedKey = key;
  const character = byKey.get(key);
  details.replaceChildren(element("div", "CHARACTER / 캐릭터", "panel-tag"), element("h2", character.name), element("p", character.flavor || "이 캐릭터의 역할과 말투를 정해보세요."));
  details.append(element("div", "tool은 캐릭터가 실제로 할 수 있는 행동입니다. 같은 팀이어도 가진 tool은 다를 수 있어요. 하나를 붙여주면 무엇이 달라질까요?", "lesson"));
  character.jobs.forEach(job => {
    const block = element("div", undefined, "job");
    block.append(element("b", job.name), element("span", job.trigger));
    if (job.write_scope.length) block.append(element("p", "scope · 이 작업에 선언한 쓰기 범위: " + job.write_scope.join(", "), "scope"));
    const extensions = Object.entries(job.extensions).filter(([,enabled])=>enabled).map(([name])=>name);
    if (extensions.length) block.append(element("p", "추가 실행 기능: " + extensions.join(", "), "note"));
    details.append(block); renderTools(job.tools);
  });
  character.tool_groups.forEach(renderTools);
  details.append(element("p", "대화용 목록은 전용 채널 기준입니다. 하네스는 멘션 주소를 확인하는 연결용 tool도 자동으로 추가합니다. 외부 채널에서 전달된 대화에는 공통 tool만 제공됩니다.", "note"));
  if (character.conversation_plugins) details.append(element("p", "대화에서 플러그인 사용이 켜져 있습니다. 플러그인이 제공하는 기능은 이 정적 tool 목록에 포함되지 않습니다.", "note"));
  details.append(element("p", "이 목록은 코드에 등록된 tool입니다. 쓰기 경로가 표시되지 않았다고 읽기 전용인 것은 아닙니다. 실제 권한은 각 tool의 구현에서 정해집니다.", "note"));
  highlight();
}
function highlight() {
  const query = document.getElementById("search").value.trim().toLocaleLowerCase();
  const active = selectedRelation >= 0 ? world.relationships[selectedRelation] : null;
  cards.forEach((card,key) => {
    const character = byKey.get(key);
    const match = [character.name,character.flavor,...allTools(character).map(tool=>tool.name)].join(" ").toLocaleLowerCase().includes(query);
    card.classList.toggle("faded", !match || Boolean(active && key!==active.source && key!==active.target));
    card.classList.toggle("selected", key===selectedKey);
    card.setAttribute("aria-pressed", String(key===selectedKey));
  });
  edgeElements.forEach(({path,label,relation},index) => {
    const focused = active ? index===selectedRelation : !selectedKey || relation.source===selectedKey || relation.target===selectedKey;
    path.classList.toggle("active", index===selectedRelation);
    path.classList.toggle("faded", !focused); label.classList.toggle("faded", !focused);
    relationButtons[index].setAttribute("aria-pressed", String(index===selectedRelation));
  });
}
function showRelation(index) {
  selectedRelation=index;
  const relation=world.relationships[index];
  selectCharacter(relation.source);
  document.getElementById("story-title").textContent=`${byKey.get(relation.source).name} → ${byKey.get(relation.target).name} · ${relation.label}`;
  document.getElementById("story-text").textContent=relation.description || "설정한 캐릭터 관계입니다. 어떤 도움을 주고받는지 설명을 붙여보세요.";
}
function stopTour() {
  clearInterval(timer); timer=null;
  document.getElementById("play").textContent="▷ 관계 둘러보기";
  document.getElementById("play").setAttribute("aria-pressed","false");
}
document.getElementById("play").disabled=!world.relationships.length;
document.getElementById("play").addEventListener("click",()=>{
  if(timer) {stopTour();return;}
  showRelation((selectedRelation+1)%world.relationships.length);
  document.getElementById("play").textContent="Ⅱ 둘러보기 멈춤";
  document.getElementById("play").setAttribute("aria-pressed","true");
  timer=setInterval(()=>showRelation((selectedRelation+1)%world.relationships.length),3500);
});
document.getElementById("search").addEventListener("input",highlight);
document.getElementById("reset").addEventListener("click",()=>{
  stopTour();selectedKey=null;selectedRelation=-1;document.getElementById("search").value="";highlight();
  document.getElementById("story-title").textContent="캐릭터들이 연결되면 이야기가 시작됩니다.";
  document.getElementById("story-text").textContent="관계는 세계관 설정입니다. 화살표 자체가 도구 권한이나 자동 실행을 만들지는 않습니다.";
});
if(world.characters.length) {
  selectCharacter((world.characters.find(character=>character.main)||world.characters[0]).key);
  selectedKey=null; highlight();
}
fitMap();
</script>
</body>
</html>
