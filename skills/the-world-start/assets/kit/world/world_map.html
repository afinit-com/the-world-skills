<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World map</title>
<style>
:root{
  --bg:#ffffff;--panel:#f7f7f8;--ink:#18181b;--muted:#6b6b74;--faint:#a1a1aa;--line:#e4e4e7;
  --hover:#f4f4f5;--select:#ececef;--main:#4338ca;--main-soft:#e0e7ff;--risk:#b91c1c;--risk-soft:#fee2e2;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f0f11;--panel:#17171a;--ink:#ececef;--muted:#9a9aa3;--faint:#62626b;--line:#2a2a30;
  --hover:#1c1c20;--select:#26262c;--main:#a5b4fc;--main-soft:#312e81;--risk:#fca5a5;--risk-soft:#450a0a;
  color-scheme:dark;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--main);outline-offset:2px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.wrap{max-width:1240px;margin:0 auto;padding:28px 24px 64px}
header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:28px}
h1{font-size:22px;font-weight:650;margin:0}
.meta{color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:32px;align-items:start}.grid>*{min-width:0}
@media (max-width:900px){.grid{grid-template-columns:1fr}aside{position:static}}
@media (max-width:600px){.wrap{padding:20px 16px 48px}.col-what,.col-tools{display:none}.search{max-width:none}}
h2{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 10px}
section+section{margin-top:36px}
/* relations */
.graph{border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow-x:auto}
.graph svg{display:block}
.node{cursor:pointer}
.node rect{fill:var(--bg);stroke:var(--line);stroke-width:1}
.node text{fill:var(--ink);font-size:13px}
.node.main rect{stroke:var(--main);stroke-width:2}
.node.main text{fill:var(--main);font-weight:600}
.node.selected rect{fill:var(--select)}
.node:hover rect{fill:var(--hover)}
.edge{fill:none;stroke:var(--faint);stroke-width:1.25}
.edge-label{fill:var(--muted);font-size:12px;paint-order:stroke;stroke:var(--panel);stroke-width:5px;stroke-linejoin:round}
.empty{color:var(--muted);padding:16px}
/* table */
.search{width:100%;max-width:320px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);margin-bottom:10px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:8px 12px;border-bottom:1px solid var(--line)}
td{padding:0;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--hover)}
tr.row.selected td{background:var(--select)}
td .cell{display:block;padding:12px;min-height:52px}
.name{font-weight:600}
.key{color:var(--faint)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:1px}
.tag.main{background:var(--main-soft);color:var(--main)}
.tag.risk{background:var(--risk-soft);color:var(--risk)}
td .cell.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);min-height:0;margin:12px;padding:0}
/* detail */
aside{position:sticky;top:20px;border:1px solid var(--line);border-radius:8px;padding:20px;background:var(--bg)}
aside h3{font-size:18px;margin:0}
aside .flavor{color:var(--muted);margin:8px 0 0}
.group{margin-top:24px}
.group h4{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.item{padding:8px 0}
.item+.item{border-top:1px dashed var(--line)}
.item .title{font-weight:600}
.kv{display:grid;grid-template-columns:72px 1fr;gap:2px 8px;margin-top:4px;color:var(--muted)}
.kv b{font-weight:500;color:var(--faint)}
.risk-box{margin-top:16px;padding:10px 12px;border-radius:6px;background:var(--risk-soft);color:var(--risk)}
.sub{font-size:12px;color:var(--faint)}.tool{padding:6px 0}
.tool .desc{color:var(--muted)}
.none{color:var(--faint)}
.rel{display:flex;gap:10px;align-items:center}
.rel button{border:0;background:none;padding:10px 0;min-height:40px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
footer{margin-top:40px;color:var(--faint);font-size:12px}
</style>
</head>
<body>
<script type="application/json" id="world-data">__WORLD_DATA__</script>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <span class="meta" id="meta"></span>
  </header>
  <div class="grid">
    <main>
      <section aria-labelledby="rel-h">
        <h2 id="rel-h">관계</h2>
        <div class="graph" id="graph"></div>
      </section>
      <section aria-labelledby="cast-h">
        <h2 id="cast-h">캐릭터</h2>
        <input class="search" id="search" type="search" placeholder="이름이나 tool로 찾기" aria-label="이름이나 tool로 찾기">
        <table>
          <thead><tr><th style="width:24%">캐릭터</th><th class="col-what">하는 일</th><th style="width:20%">언제</th><th class="col-tools" style="width:20%">tool</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
    </main>
    <aside id="detail" aria-live="polite"></aside>
  </div>
  <footer id="footer"></footer>
</div>
<script>
const world = JSON.parse(document.getElementById("world-data").textContent);
const chars = world.characters;
const byKey = Object.fromEntries(chars.map(c => [c.key, c]));
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const firstSentence = s => { const t = String(s || "").trim(); const m = t.match(/^.*?[.!?。](\s|$)/); return m ? m[0].trim() : t; };

function toolsOf(c) {
  const names = [];
  for (const j of c.jobs) for (const t of j.tools.tools) names.push(t.name);
  for (const g of c.tool_groups) for (const t of g.tools) names.push(t.name);
  return [...new Set(names)];
}
function runsOf(c) {
  if (!c.jobs.length) return c.main ? "대화 창구" : "넘겨받을 때";
  return [...new Set(c.jobs.map(j => j.trigger))].join(", ");
}
function risksOf(c) {
  const out = [];
  for (const j of c.jobs) {
    if (j.extensions.shell) out.push(`${j.name}: 셸(Bash) 사용`);
    if (j.extensions.subagents) out.push(`${j.name}: 하위 에이전트 사용`);
    if (j.extensions.plugins) out.push(`${j.name}: 외부 플러그인 사용`);
    if (j.mutates) out.push(`${j.name}: 저장소를 직접 수정`);
  }
  if (c.conversation_plugins) out.push("대화 중 외부 플러그인 사용");
  return out;
}

$("title").textContent = world.name;
document.title = `${world.name} · World map`;
$("meta").textContent = `캐릭터 ${chars.length} · 관계 ${world.relationships.length}`;
$("footer").textContent = `생성 ${new Date(world.generated_at).toLocaleString()} · 코드에 선언된 내용만 보여 줍니다. 실행 중인 상태는 STATUS.md를 보세요.`;

let selected = (chars.find(c => c.main) || chars[0] || {}).key;

/* ---------- relations graph: layered left to right from the main character ---------- */
function drawGraph() {
  const rels = world.relationships;
  if (!rels.length) { $("graph").innerHTML = '<div class="empty">선언된 관계가 없습니다.</div>'; return; }
  const main = (chars.find(c => c.main) || chars[0]).key;
  const layer = {[main]: 0}; const queue = [main];
  while (queue.length) {
    const k = queue.shift();
    for (const r of rels) {
      for (const [a, b] of [[r.source, r.target], [r.target, r.source]]) {
        if (a === k && !(b in layer)) { layer[b] = layer[k] + 1; queue.push(b); }
      }
    }
  }
  const maxLayer = Math.max(0, ...Object.values(layer));
  for (const c of chars) if (!(c.key in layer)) layer[c.key] = maxLayer + 1;
  const cols = {};
  for (const c of chars) (cols[layer[c.key]] ||= []).push(c);
  const W = 150, H = 40, PAD = 24;
  const nCols = Object.keys(cols).length;
  const tallest = Math.max(...Object.values(cols).map(a => a.length));
  // Left to right while it fits; top to bottom on a narrow screen, so every character
  // stays on screen and tappable instead of scrolled off to the side.
  const across = PAD * 2 + nCols * W + (nCols - 1) * 170 <= $("graph").clientWidth;
  const GX = across ? 170 : 16, GY = across ? 32 : 64;
  const pos = {};
  let width, height;
  if (across) {
    height = PAD * 2 + tallest * H + (tallest - 1) * GY;
    width = PAD * 2 + nCols * W + (nCols - 1) * GX;
    Object.entries(cols).forEach(([l, list]) => {
      const colH = list.length * H + (list.length - 1) * GY;
      list.forEach((c, i) => { pos[c.key] = {x: PAD + l * (W + GX), y: (height - colH) / 2 + i * (H + GY)}; });
    });
  } else {
    const nodeW = Math.min(W, ($("graph").clientWidth - PAD * 2 - (tallest - 1) * GX) / tallest);
    width = $("graph").clientWidth;
    height = PAD * 2 + nCols * H + (nCols - 1) * GY;
    Object.entries(cols).forEach(([l, list]) => {
      const rowW = list.length * nodeW + (list.length - 1) * GX;
      list.forEach((c, i) => { pos[c.key] = {x: (width - rowW) / 2 + i * (nodeW + GX), y: PAD + l * (H + GY), w: nodeW}; });
    });
  }
  let edges = "", labels = "";
  for (const r of rels) {
    const a = pos[r.source], b = pos[r.target];
    if (!a || !b) continue;
    const aw = a.w || W, bw = b.w || W;
    if (across) {
      const forward = a.x <= b.x;
      const x1 = forward ? a.x + aw : a.x, x2 = forward ? b.x : b.x + bw;
      const y1 = a.y + H / 2, y2 = b.y + H / 2, mx = (x1 + x2) / 2;
      edges += `<path class="edge" marker-end="url(#arrow)" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2 - (forward ? 4 : -4)},${y2}"/>`;
      // on the flat run into the target, where the curve has straightened out
      // just before the arrowhead, on the side the curve does not come in from
      const ly = y1 >= y2 ? y2 - 9 : y2 + 17;
      labels += `<text class="edge-label" x="${x2 + (forward ? -10 : 10)}" y="${ly}" text-anchor="${forward ? "end" : "start"}">${esc(r.label)}</text>`;
    } else {
      const down = a.y <= b.y;
      const x1 = a.x + aw / 2, x2 = b.x + bw / 2;
      const y1 = down ? a.y + H : a.y, y2 = down ? b.y : b.y + H, my = (y1 + y2) / 2;
      edges += `<path class="edge" marker-end="url(#arrow)" d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2 - (down ? 4 : -4)}"/>`;
      labels += `<text class="edge-label" x="${(x1 + x2) / 2}" y="${my + 4}" text-anchor="middle">${esc(r.label)}</text>`;
    }
  }
  let nodes = "";
  for (const c of chars) {
    const p = pos[c.key];
    const cls = ["node", c.main ? "main" : "", c.key === selected ? "selected" : ""].join(" ");
    nodes += `<g class="${cls}" data-key="${esc(c.key)}" tabindex="0" role="button" aria-label="${esc(c.name)}">
      <rect x="${p.x}" y="${p.y}" width="${p.w || W}" height="${H}" rx="6"/>
      <text x="${p.x + (p.w || W) / 2}" y="${p.y + H / 2 + 5}" text-anchor="middle">${esc(c.name.length > 11 ? c.name.slice(0, 10) + "…" : c.name)}</text></g>`;
  }
  $("graph").innerHTML = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--faint)"/></marker></defs>${edges}${labels}${nodes}</svg>`;
  $("graph").querySelectorAll(".node").forEach(n => {
    n.addEventListener("click", () => select(n.dataset.key, true));
    n.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(n.dataset.key); } });
  });
}

/* ---------- table ---------- */
function drawRows() {
  const q = $("search").value.trim().toLowerCase();
  const list = chars.filter(c => !q || [c.name, c.key, c.flavor, ...toolsOf(c)].join(" ").toLowerCase().includes(q));
  $("rows").innerHTML = list.map(c => {
    const tools = toolsOf(c);
    const shown = tools[0] + (tools.length > 1 ? ` +${tools.length - 1}` : "");
    const risk = risksOf(c).length ? '<span class="tag risk">주의</span>' : "";
    return `<tr class="row${c.key === selected ? " selected" : ""}" data-key="${esc(c.key)}" tabindex="0" aria-selected="${c.key === selected}">
      <td><span class="cell"><span class="name">${esc(c.name)}</span>${c.main ? '<span class="tag main">창구</span>' : ""}${risk}<br><span class="key mono">${esc(c.key)}</span></span></td>
      <td class="col-what"><span class="cell clip">${esc(c.flavor) || '<span class="none">설명 없음</span>'}</span></td>
      <td><span class="cell">${esc(runsOf(c))}</span></td>
      <td class="col-tools"><span class="cell mono">${tools.length ? esc(shown) : '<span class="none">없음</span>'}</span></td></tr>`;
  }).join("") || '<tr><td colspan="4"><span class="cell none">찾는 캐릭터가 없습니다.</span></td></tr>';
  $("rows").querySelectorAll("tr.row").forEach(r => {
    r.addEventListener("click", () => select(r.dataset.key, true));
    r.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(r.dataset.key); }
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        const next = e.key === "ArrowDown" ? r.nextElementSibling : r.previousElementSibling;
        if (next && next.dataset.key) { select(next.dataset.key); next.focus(); }
      }
    });
  });
}

/* ---------- detail ---------- */
function toolList(tools, dynamic) {
  if (dynamic) return '<div class="none">실행할 때 정해집니다</div>';
  if (!tools.length) return '<div class="none">없음</div>';
  return tools.map(t => `<div class="tool"><span class="mono">${esc(t.name)}</span>
    ${t.description ? `<div class="desc">${esc(firstSentence(t.description))}</div>` : ""}
    ${t.write_roots.length ? `<div class="desc">쓰기: <span class="mono">${esc(t.write_roots.join(", "))}</span></div>` : ""}</div>`).join("");
}
function drawDetail() {
  const c = byKey[selected];
  if (!c) { $("detail").innerHTML = '<div class="none">캐릭터를 고르세요.</div>'; return; }
  const risks = risksOf(c);
  const out = world.relationships.filter(r => r.source === c.key);
  const inc = world.relationships.filter(r => r.target === c.key);
  const rel = (r, other) => `<div class="rel"><button data-key="${esc(other)}">${esc(byKey[other]?.name || other)}</button><span class="desc">${esc(r.label)}</span></div>`;
  const jobs = c.jobs.map(j => `<div class="item"><div class="title mono">${esc(j.name)}</div>
    <div class="kv"><b>언제</b><span>${esc(j.trigger)}</span>
    ${j.watches.length ? `<b>보는 것</b><span>${esc(j.watches.join(" · "))}</span>` : ""}
    <b>쓰기</b><span class="mono">${j.write_scope.length ? esc(j.write_scope.join(", ")) : "없음"}</span></div>
    <div style="margin-top:6px">${toolList(j.tools.tools, j.tools.dynamic)}</div></div>`).join("");
  const talk = c.tool_groups.filter(g => g.dynamic || g.tools.length).map(g =>
    `<div class="item"><div class="sub">${esc(g.label.replace(/^대화할 때 · /, ""))}</div>${toolList(g.tools, g.dynamic)}</div>`).join("");
  $("detail").innerHTML = `
    <h3>${esc(c.name)}${c.main ? '<span class="tag main">창구</span>' : ""}</h3>
    <div class="key mono">${esc(c.key)}</div>
    ${c.flavor ? `<p class="flavor">${esc(c.flavor)}</p>` : ""}
    ${risks.length ? `<div class="risk-box"><b>주의할 권한</b><br>${risks.map(esc).join("<br>")}</div>` : ""}
    <div class="group"><h4>하는 일</h4>${jobs || '<div class="none">정해진 일 없음 · 대화와 넘겨받은 요청에만 답합니다</div>'}</div>
    <div class="group"><h4>대화할 때 쓰는 tool</h4>${talk || '<div class="none">없음</div>'}</div>
    <div class="group"><h4>관계</h4>
      ${out.map(r => rel(r, r.target)).join("")}${inc.map(r => rel(r, r.source)).join("")}
      ${!out.length && !inc.length ? '<div class="none">없음</div>' : ""}</div>`;
  $("detail").querySelectorAll(".rel button").forEach(b => b.addEventListener("click", () => select(b.dataset.key)));
}

function select(key, reveal) {
  selected = key; drawGraph(); drawRows(); drawDetail();
  if (reveal && matchMedia("(max-width:900px)").matches) $("detail").scrollIntoView({behavior: "smooth", block: "start"});
}
$("search").addEventListener("input", drawRows);
let resizeTimer; addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawGraph, 100); });
select(selected);
</script>
</body>
</html>
